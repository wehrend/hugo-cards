name: Deploy to Github Pages

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 0.169.0
          extended: true
      - name: Install Dart Sass
        run: |
          wget -q -O dart-sass.tar.gz https://github.com/sass/dart-sass/releases/download/1.89.2/dart-sass-1.89.2-linux-x64.tar.gz
          tar -C "${RUNNER_TEMP}" -xzf dart-sass.tar.gz
          echo "${RUNNER_TEMP}/dart-sass" >> "${GITHUB_PATH}"
      - name: Run Hugo
        working-directory: exampleSite
        run: hugo --minify --themesDir ../.. --baseURL="https://wehrend.github.io/hugo-cards/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'exampleSite/public'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
