  goal:
    en: "From voltage and current to how a CPU reacts to the outside world"
    de: "Von Spannung und Strom bis dazu, wie eine CPU auf die Außenwelt reagiert"
  steps:
    - /pages/electronics-100
    - /pages/adc-dac
