# Example site for the Hugo Cards theme.
# Run from the repository root:
#   cd exampleSite && hugo server --themesDir ../..
# (the repository folder must be named "hugo-cards")

baseURL = 'https://example.org/'
title = 'Hugo Cards'
theme = 'hugo-cards'

enableGitInfo = false
disablePathToLower = true

[markup.goldmark.renderer]
  unsafe = true

[markup.tableOfContents]
  startLevel = 2

[languages]
[languages.en]
  languageName = 'English'
  contentDir = 'content/en'
  weight = 1

[[languages.en.menu.before]]
  name = 'About'
  url = '/about/'
  weight = 10

[[languages.en.menu.before]]
  name = 'Sitemap'
  url = '/sitemap/'
  weight = 20

[languages.de]
  languageName = 'Deutsch'
  contentDir = 'content/de'
  weight = 2

[[languages.de.menu.before]]
  name = 'Über'
  url = '/de/about/'
  weight = 10

[[languages.de.menu.before]]
  name = 'Sitemap'
  url = '/de/sitemap/'
  weight = 20

[params]
  BookTheme = 'light'
  BookToC = true
  # Section rendered as the left-hand menu
  BookSection = 'pages'
  BookFavicon = 'svg/cpu.svg'
  BookRepo = 'https://github.com/wehrend/hugo-cards/'
  BookSearch = true
  BookComments = false
